command: "test integration"
description: "Build artifacts and run integration tests"
runtime: make
script: ../make/common.mk
target: integration
args:
  - name: filter
    type: string
    env: TOX_INTEGRATION_FILTER
    envbind: TOX_INTEGRATION_FILTER
    help: "pytest -k filter expression (e.g. test_active)"
  - name: project-args
    type: string
    env: TOX_INTEGRATION_PROJECT_ARGS
    envbind: TOX_INTEGRATION_PROJECT_ARGS
    help: "Project-specific integration arguments from .env (e.g. --charm-file, --synapse-image)"
  - name: extra-args
    type: string
    env: TOX_INTEGRATION_EXTRA_ARGS
    envbind: TOX_INTEGRATION_EXTRA_ARGS
    help: "Additional user-provided pytest arguments"
  - name: charm-version
    type: string
    env: CHARM_VERSION
    envbind: CHARM_VERSION
    help: "Override the charm version tag (default: git describe)"
dependencies:
  bins: [make, python3, yq, charmcraft, rockcraft, juju]
