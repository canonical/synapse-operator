command: "build rock"
description: "Build the ROCK OCI image"
runtime: make
script: ../make/common.mk
target: build-rock
args:
  - name: rock-dir
    type: string
    env: ROCK_DIR
    envbind: ROCK_DIR
    help: "Path to the rockcraft project directory"
  - name: rock-name
    type: string
    env: ROCK_NAME
    envbind: ROCK_NAME
    help: "ROCK artifact name"
  - name: rock-platform
    type: string
    env: ROCK_PLATFORM
    envbind: ROCK_PLATFORM
    help: "ROCK platform (e.g. amd64)"
  - name: container-registry
    type: string
    env: CONTAINER_REGISTRY
    envbind: CONTAINER_REGISTRY
    help: "Container registry used for derived ROCK image names"
  - name: rock-image-tag
    type: string
    env: ROCK_IMAGE_TAG
    envbind: ROCK_IMAGE_TAG
    help: "Override the derived ROCK image tag"
dependencies:
  bins: [make, yq, rockcraft]
