[tool.bandit]
exclude_dirs = ["/venv/"]
[tool.bandit.assert_used]
skips = ["*/*test.py", "*/test_*.py", "*tests/*.py"]

# Testing tools configuration
[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 88
show_missing = true


[tool.pytest.ini_options]
minversion = "6.0"
log_cli_level = "INFO"
markers = [
    "requires_secrets: mark tests that require external secrets",
    "cos: mark tests that require a COS integration",
    "nginx: mark tests that require an nginx integration",
    "s3: mark tests that require an s3 integration (via localstack)",
    "irc: mark tests that require an irc integration",
    "mjolnir: mark tests that require a Mjolnir deployment",
    "redis: mark tests that require a redis integration",
]
filterwarnings = [
    # Pytest prepends each entry to warnings.filters, so later entries take
    # precedence at runtime. Put "error" first, then more specific ignores below.
    "error",
    # TODO: migrate tests/unit_harness from Harness to Scenario.
    "ignore:Harness is deprecated:PendingDeprecationWarning",
    # TODO: use self.model.juju_version in src/admin_access_token.py; the
    # data_platform_libs data_interfaces lib also still calls from_environ().
    "ignore:JujuVersion.from_environ:DeprecationWarning",
    # TODO: fix leaked file handles and Harness instances, then remove this.
    "ignore::ResourceWarning",
    # Third-party warnings from the pytest-operator / python-libjuju integration
    # test stack (protobuf/macaroonbakery, paramiko, websockets, juju).
    "ignore::DeprecationWarning:google.*",
    "ignore::DeprecationWarning:macaroonbakery.*",
    "ignore::DeprecationWarning:paramiko.*",
    "ignore::DeprecationWarning:websockets.*",
    "ignore::DeprecationWarning:juju.*",
    # TODO: fix Juju/websockets receive tasks surviving event-loop shutdown.
    # Match the third-party traceback too; other unraisable exceptions stay fatal.
    'ignore:(?s)^Exception ignored in\x3a <coroutine object Connection\.recv at 0x[0-9a-f]+>.*[/\\]websockets[/\\]asyncio[/\\]connection\.py.*\nRuntimeError\x3a Event loop is closed\n:pytest.PytestUnraisableExceptionWarning',
]

[tool.pylint.'MESSAGES CONTROL']
extension-pkg-whitelist = "pydantic"

# Formatting tools configuration
[tool.black]
line-length = 99
target-version = ["py38"]

[tool.isort]
line_length = 99
profile = "black"

# Linting tools configuration
[tool.flake8]
max-line-length = 99
max-doc-length = 99
max-complexity = 10
exclude = [".git", "__pycache__", ".tox", "build", "dist", "*.egg_info", "venv"]
select = ["E", "W", "F", "C", "N", "R", "D", "H"]
# Ignore W503, E501 because using black creates errors with this
# Ignore D107 Missing docstring in __init__
ignore = ["W503", "E501", "D107"]
# D100, D101, D102, D103: Ignore missing docstrings in tests
per-file-ignores = ["tests/*:D100,D101,D102,D103,D104,D205,D212,D415"]
docstring-convention = "google"
# Check for properly formatted copyright header in each file
copyright-check = "True"
copyright-author = "Canonical Ltd."
copyright-regexp = "Copyright\\s\\d{4}([-,]\\d{4})*\\s+%(author)s"
classmethod-decorators = ['classmethod', 'validator', 'root_validator']

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
