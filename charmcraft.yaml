# This file configures Charmcraft.
# See https://juju.is/docs/sdk/charmcraft-config for guidance.

type: charm
bases:
- build-on:
  - name: ubuntu
    channel: "22.04"
  run-on:
  - name: ubuntu
    channel: "22.04"
charm-libs:
- lib: traefik_k8s.ingress
  version: "2"
- lib: hydra.oauth
  version: "0"
parts:
  charm:
    source: .
    plugin: uv
    build-snaps:
    - astral-uv
  dump:
    plugin: dump
    source: .
    stage:
    - scripts
    - templates
